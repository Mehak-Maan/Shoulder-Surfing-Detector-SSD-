[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "C4", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["."]
exclude = ["build/"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
